  <script>
    // Apply saved theme/lang before first paint (avoids a flash). Storage may be blocked -> try/catch.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("secureqa.learn.v1") || "{}");
        var theme = s.theme || (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.setAttribute("lang", s.lang === "en" ? "en" : "tr");
      } catch (e) { /* ignore */ }
    })();
  </script>
